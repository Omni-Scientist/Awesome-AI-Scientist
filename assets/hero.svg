<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Awesome AI Scientist</title>
  <desc id="d">The closed research loop of an AI Scientist: literature, hypothesis, design, experiment, analysis, writing, review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="55%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#132b45"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="34%" stop-color="#a78bfa"/>
      <stop offset="68%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1280" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="640" cy="222" r="250" fill="url(#glow)"/>

  <g stroke="#38bdf8" stroke-opacity=".10" stroke-width="1">
    <path d="M0 90 H1280 M0 330 H1280 M200 0 V420 M1080 0 V420"/>
  </g>

  <text x="640" y="62" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="40" font-weight="800" letter-spacing="7" fill="url(#title)">AWESOME AI SCIENTIST</text>
  <text x="640" y="90" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="13" font-weight="500" letter-spacing="4" fill="#7dd3fc">PAPERS · SYSTEMS · WORKBENCHES · BENCHMARKS · DATA</text>

  <circle cx="640" cy="238" r="98" fill="#080e1a" stroke="url(#ring)" stroke-width="3" filter="url(#soft)"/>
  <circle cx="640" cy="238" r="112" fill="none" stroke="#64748b" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 7"/>
  <text x="640" y="232" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="21" font-weight="750" letter-spacing="2" fill="#f8fafc">CLOSED</text>
  <text x="640" y="258" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
        font-size="21" font-weight="750" letter-spacing="2" fill="#f8fafc">LOOP</text>

  <g fill="none" stroke="#93c5fd" stroke-width="2.6" marker-end="url(#ar)" opacity=".85">
    <path d="M566 176 C 500 132, 402 152, 380 202"/>
    <path d="M380 274 C 402 330, 500 356, 566 306"/>
    <path d="M714 306 C 780 356, 878 330, 900 274"/>
    <path d="M900 202 C 878 152, 780 132, 714 176"/>
    <path d="M596 148 C 618 136, 662 136, 684 148"/>
    <path d="M684 330 C 662 342, 618 342, 596 330"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g fill="#f1f5f9" font-size="15" font-weight="700" letter-spacing=".6">
      <text x="228" y="176">📚 LITERATURE</text>
      <text x="228" y="330">💡 HYPOTHESIS</text>
      <text x="640" y="140">🧭 DESIGN</text>
      <text x="1052" y="176">📊 ANALYSIS</text>
      <text x="1052" y="330">🧪 EXPERIMENT</text>
      <text x="640" y="374">✍️ WRITING &amp; REVIEW</text>
    </g>
    <g fill="#94a3b8" font-size="11.5" font-weight="500">
      <text x="228" y="196">retrieve · ground</text>
      <text x="228" y="350">generate · rank</text>
      <text x="1052" y="196">explain · verify</text>
      <text x="1052" y="350">run · observe</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600"
     letter-spacing="1.4" fill="#64748b" text-anchor="middle">
    <text x="640" y="404">⚗️ CHEMISTRY  ·  🧬 BIOLOGY  ·  🔭 PHYSICS  ·  ➗ MATH  ·  🌍 EARTH  ·  🏛️ SOCIAL SCIENCE</text>
  </g>
</svg>
