<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Scientist research loop</title>
  <desc id="desc">A circular workflow connecting literature, hypothesis, design, experiment, analysis, and writing around an AI Scientist.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#193b5a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="600" cy="180" r="116" fill="#0b1220" stroke="url(#ring)" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="600" cy="180" r="128" fill="none" stroke="#64748b" stroke-opacity=".25" stroke-width="1"/>

  <g fill="none" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)" opacity=".9">
    <path d="M 495 102 C 428 50, 328 75, 304 133"/>
    <path d="M 306 196 C 330 258, 430 285, 495 258"/>
    <path d="M 705 258 C 770 285, 870 258, 894 196"/>
    <path d="M 896 133 C 872 75, 772 50, 705 102"/>
    <path d="M 535 72 C 570 52, 630 52, 665 72"/>
    <path d="M 665 288 C 630 308, 570 308, 535 288"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="164" fill="#f8fafc" font-size="26" font-weight="750" letter-spacing="2">AI SCIENTIST</text>
    <text x="600" y="193" fill="#bfdbfe" font-size="14" letter-spacing="1">evidence → ideas → experiments</text>
    <text x="600" y="217" fill="#bfdbfe" font-size="14" letter-spacing="1">→ analysis → knowledge</text>

    <g fill="#f8fafc" font-size="16" font-weight="650">
      <text x="250" y="84">LITERATURE</text>
      <text x="250" y="106" fill="#93c5fd" font-size="12" font-weight="500">retrieve &amp; synthesize</text>
      <text x="408" y="307">HYPOTHESIS</text>
      <text x="408" y="329" fill="#93c5fd" font-size="12" font-weight="500">generate &amp; rank</text>
      <text x="792" y="307">EXPERIMENT</text>
      <text x="792" y="329" fill="#93c5fd" font-size="12" font-weight="500">run &amp; observe</text>
      <text x="950" y="84">ANALYSIS</text>
      <text x="950" y="106" fill="#93c5fd" font-size="12" font-weight="500">explain &amp; verify</text>
      <text x="600" y="42">DESIGN</text>
      <text x="600" y="62" fill="#93c5fd" font-size="12" font-weight="500">plan &amp; implement</text>
      <text x="600" y="350">WRITING</text>
    </g>
  </g>
</svg>
